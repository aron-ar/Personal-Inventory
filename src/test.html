<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Room Booking</title>
    <link rel="stylesheet" href="css/styles-test.css">
</head>

<body>
    <header>
        <h1>University Room Booking</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Rooms</a>
            <a href="#">My Bookings</a>
        </nav>
    </header>
    <main>
        <section class="booking">
            <h2>Book a Study Room</h2>
            <form>
                <div class="form-field">
                    <label for="date">Date</label>
                    <input id="date" type="date">
                </div>
                <div class="form-field">
                    <label for="time">Time</label>
                    <input id="time" type="time">
                </div>
                <button type="submit">Find Rooms</button>
            </form>
        </section>
        <section>
            <h2>Available Rooms</h2>
            <div class="rooms">
                <article class="room-card">
                    <h3>Room 101</h3>
                    <p>Capacity: 6 people</p>
                    <p>Projector, Whiteboard</p>
                    <button>Book Room</button>
                </article>
                <article class="room-card">
                    <h3>Room 205</h3>
                    <p>Capacity: 10 people</p>
                    <p>Projector, TV</p>
                    <button>Book Room</button>
                </article>
                <article class="room-card">
                    <h3>Room 310</h3>
                    <p>Capacity: 4 people</p>
                    <p>Whiteboard</p>
                    <button>Book Room</button>
                </article>
            </div>
        </section>
    </main>
    <footer>
        <p>University Room Booking System</p>
    </footer>
</body>

</html>
