<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Item Details</title>
</head>
<body>
	<main>
		<article>
			<header>
				<h1>Item Details</h1>
				<h2>Cordless Drill</h2>
			</header>

			<dl>
				<dt>Category</dt>
				<dd>Tools</dd>

				<dt>Storage location</dt>
				<dd>Home → Garage</dd>
				<!--<dd>Level 1: Home &rarr; Level 2: Garage</dd>-->
                
				<figure>
				<img src="" alt="Photo of Cordless Drill" width="200" height="200">
				<figcaption>Photo</figcaption>
				</figure>

				<dt>How often used</dt>
				<dd>Occasionally</dd>

				<dt>Condition</dt>
				<dd>New</dd>

				<dt>Quantity</dt>
				<dd>1</dd>

				<dt>Unit of Measure</dt>
				<dd>UN</dd>

				<dt>Decision</dt>
				<dd>Sell</dd>
			</dl>

			<nav aria-label="Item actions">
				<button type="button">Cancel</button>
				<button type="button">Edit</button>
				<button type="button">Delete</button>
			</nav>
		</article>
	</main>
</body>
</html>
